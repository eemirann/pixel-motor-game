  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d", { alpha: false });

  // ---------------------------------------------------------------- world
  // Sabit yükseklikli sanal dünya: her ekranda aynı zorluk.
  const WORLD_H = 640;
  let WORLD_W = 360;          // ekran oranına göre hesaplanır
  let scale = 1, offX = 0, offY = 0;

  const GROUND_H = 84;
  const GRAVITY = 1500;
  const FLAP_V = -440;
  const MAX_FALL = 760;
  const BIRD_R = 21;
  const BIRD_X = () => WORLD_W * 0.3;

  const PIPE_W = 66;
  const PIPE_GAP = 156;
  const PIPE_SPACING = 208;
  const BASE_SPEED = 152;
  const MAX_SPEED = 232;

  // ---------------------------------------------------------------- state
  const READY = 0, PLAY = 1, DYING = 2, OVER = 3;
  let state = READY;
  let paused = false;

  const bird = { y: 0, v: 0, rot: 0 };
  let pipes = [];
  let lastTop = null;
  let score = 0;
  let best = 0;
  try { best = parseInt(localStorage.getItem("flappyface.best") || "0", 10) || 0; } catch (e) { best = 0; }

  let speed = BASE_SPEED;
  let groundX = 0;
  let flashA = 0;         // ölüm flaşı
  let overT = 0;          // game over paneli animasyonu
  let readyT = 0;
  let scorePop = 0;
  let shake = 0;
  const puffs = [];
  const clouds = [];
  const hills = [];

  // ---------------------------------------------------------------- assets
  const faceImg = new Image();
  let faceReady = false;
  faceImg.onload = () => { faceReady = true; };
  faceImg.src = FACE_SRC;

  // ---------------------------------------------------------------- audio
  let actx = null;
  function beep(freq, dur, type, vol, slideTo) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const t = actx.currentTime;
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* sessiz devam */ }
  }
  const sFlap  = () => beep(560, 0.09, "square", 0.05, 780);
  const sScore = () => beep(880, 0.11, "square", 0.06, 1320);
  const sHit   = () => beep(180, 0.20, "sawtooth", 0.09, 70);
  const sDie   = () => beep(120, 0.36, "triangle", 0.07, 45);

  // ---------------------------------------------------------------- layout
  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";

    // Dünya yüksekliği sabit, genişlik ekran oranından; uçlarda sınırla.
    // Normal telefon oranlarında bu "contain" tam ekranı doldurur (kenar boşluğu yok);
    // sadece çok dar ya da yatay ekranlarda kenarlarda bant kalır.
    WORLD_W = Math.min(Math.max(WORLD_H * (w / h), 288), 560);
    scale = Math.min(w / WORLD_W, h / WORLD_H);   // contain
    offX = (w - WORLD_W * scale) / 2;
    offY = (h - WORLD_H * scale) / 2;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 120));

  // ---------------------------------------------------------------- helpers
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  function makeScenery() {
    clouds.length = 0;
    for (let i = 0; i < 7; i++) {
      clouds.push({ x: rand(0, WORLD_W * 2), y: rand(40, 260), s: rand(0.6, 1.5), sp: rand(6, 16) });
    }
    hills.length = 0;
    for (let i = 0; i < 8; i++) {
      hills.push({ x: i * 110 + rand(-20, 20), w: rand(110, 190), h: rand(50, 100) });
    }
  }

  function resetPipes() {
    pipes = [];
    lastTop = null;
    let x = WORLD_W + 120;
    for (let i = 0; i < 5; i++) {
      pipes.push(makePipe(x));
      x += PIPE_SPACING;
    }
  }

  function makePipe(x) {
    const margin = 68;
    const lo = margin;
    const hi = WORLD_H - GROUND_H - PIPE_GAP - margin;
    // Ardışık boşluklar arasındaki dikey fark sınırlı olsun, yoksa yetişilmiyor.
    const a = lastTop === null ? lo : Math.max(lo, lastTop - 145);
    const b = lastTop === null ? hi : Math.min(hi, lastTop + 145);
    const top = rand(a, b);
    lastTop = top;
    return { x, top, passed: false };
  }

  function reset() {
    state = READY;
    bird.y = WORLD_H * 0.42;
    bird.v = 0;
    bird.rot = 0;
    score = 0;
    speed = BASE_SPEED;
    flashA = 0;
    overT = 0;
    readyT = 0;
    shake = 0;
    puffs.length = 0;
    resetPipes();
    makeScenery();
  }

  // ---------------------------------------------------------------- input
  function flap() {
    if (paused) { paused = false; last = 0; return; }
    if (state === READY) {
      state = PLAY;
      bird.v = FLAP_V;
      sFlap();
      addPuff();
    } else if (state === PLAY) {
      bird.v = FLAP_V;
      sFlap();
      addPuff();
    } else if (state === OVER && overT > 0.55) {
      reset();
    }
  }

  function addPuff() {
    for (let i = 0; i < 4; i++) {
      puffs.push({
        x: BIRD_X() - BIRD_R * 0.5,
        y: bird.y + rand(0, BIRD_R),
        r: rand(3, 7),
        vx: rand(-70, -20),
        vy: rand(10, 60),
        life: rand(0.3, 0.6),
        t: 0
      });
    }
  }

  function onDown(e) {
    e.preventDefault();
    flap();
  }
  canvas.addEventListener("pointerdown", onDown, { passive: false });
  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); }, { passive: false });
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "Enter") {
      e.preventDefault();
      flap();
    }
  });
  document.addEventListener("gesturestart", (e) => e.preventDefault());
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state === PLAY) paused = true;
    last = 0;
  });
  window.addEventListener("blur", () => { if (state === PLAY) paused = true; });

  // ---------------------------------------------------------------- update
  function update(dt) {
    if (paused) return;
    readyT += dt;
    if (scorePop > 0) scorePop = Math.max(0, scorePop - dt * 3);
    if (shake > 0) shake = Math.max(0, shake - dt * 3.5);
    if (flashA > 0) flashA = Math.max(0, flashA - dt * 2.4);

    // dekor
    for (const c of clouds) {
      c.x -= c.sp * dt * (state === PLAY ? 1 : 0.5);
      if (c.x < -90) { c.x = WORLD_W + rand(20, 160); c.y = rand(40, 260); c.s = rand(0.6, 1.5); }
    }

    if (state === READY) {
      bird.y = WORLD_H * 0.42 + Math.sin(readyT * 3.4) * 9;
      bird.rot = Math.sin(readyT * 3.4) * 0.12;
      groundX = (groundX - BASE_SPEED * 0.5 * dt) % 32;
      for (const h of hills) {
        h.x -= BASE_SPEED * 0.1 * dt;
        if (h.x + h.w < -20) h.x += 8 * 110;
      }
      return;
    }

    if (state === PLAY) {
      speed = Math.min(MAX_SPEED, BASE_SPEED + score * 2.2);

      bird.v = Math.min(bird.v + GRAVITY * dt, MAX_FALL);
      bird.y += bird.v * dt;

      const target = clamp(bird.v / 520, -0.55, 1.35);
      bird.rot += (target - bird.rot) * Math.min(1, dt * 9);

      groundX = (groundX - speed * dt) % 32;
      for (const h of hills) {
        h.x -= speed * 0.18 * dt;
        if (h.x + h.w < -20) h.x += 8 * 110;
      }

      for (const p of pipes) p.x -= speed * dt;

      if (pipes.length && pipes[0].x + PIPE_W < -40) {
        pipes.shift();
        pipes.push(makePipe(pipes[pipes.length - 1].x + PIPE_SPACING));
      }

      const bx = BIRD_X();
      for (const p of pipes) {
        if (!p.passed && p.x + PIPE_W < bx - BIRD_R * 0.2) {
          p.passed = true;
          score++;
          scorePop = 1;
          sScore();
        }
      }

      // tavan
      if (bird.y - BIRD_R < 0) { bird.y = BIRD_R; bird.v = 0; }

      // zemin
      if (bird.y + BIRD_R >= WORLD_H - GROUND_H) {
        bird.y = WORLD_H - GROUND_H - BIRD_R;
        die(true);
      } else if (hitsPipe(bx, bird.y)) {
        die(false);
      }
    } else if (state === DYING) {
      bird.v = Math.min(bird.v + GRAVITY * 1.15 * dt, MAX_FALL);
      bird.y += bird.v * dt;
      bird.rot = Math.min(bird.rot + dt * 5.5, 1.6);
      if (bird.y + BIRD_R >= WORLD_H - GROUND_H) {
        bird.y = WORLD_H - GROUND_H - BIRD_R;
        state = OVER;
        overT = 0;
        shake = 0.8;
        sDie();
        if (score > best) {
          best = score;
          try { localStorage.setItem("flappyface.best", String(best)); } catch (e) {}
        }
      }
    } else if (state === OVER) {
      overT += dt;
    }

    // puf parçacıkları
    for (let i = puffs.length - 1; i >= 0; i--) {
      const p = puffs[i];
      p.t += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.t >= p.life) puffs.splice(i, 1);
    }
  }

  function hitsPipe(bx, by) {
    for (const p of pipes) {
      if (p.x > bx + BIRD_R || p.x + PIPE_W < bx - BIRD_R) continue;
      if (circleRect(bx, by, BIRD_R * 0.86, p.x, 0, PIPE_W, p.top)) return true;
      const by2 = p.top + PIPE_GAP;
      if (circleRect(bx, by, BIRD_R * 0.86, p.x, by2, PIPE_W, WORLD_H - GROUND_H - by2)) return true;
    }
    return false;
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = clamp(cx, rx, rx + rw);
    const ny = clamp(cy, ry, ry + rh);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function die(onGround) {
    sHit();
    flashA = 1;
    shake = 1;
    if (onGround) {
      state = OVER;
      overT = 0;
      sDie();
      if (score > best) {
        best = score;
        try { localStorage.setItem("flappyface.best", String(best)); } catch (e) {}
      }
    } else {
      state = DYING;
      bird.v = -190;
    }
  }

  // ---------------------------------------------------------------- draw
  function draw() {
    const w = window.innerWidth, h = window.innerHeight;

    ctx.fillStyle = "#1b2a33";
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.translate(offX, offY);
    ctx.scale(scale, scale);
    ctx.beginPath();
    ctx.rect(0, 0, WORLD_W, WORLD_H);
    ctx.clip();
    if (shake > 0) {
      ctx.translate(rand(-1, 1) * shake * 5, rand(-1, 1) * shake * 5);
    }

    drawSky();
    drawHills();
    drawPipes();
    drawGround();
    drawPuffs();
    drawBird();
    drawUI();

    ctx.restore();

    if (flashA > 0) {
      ctx.fillStyle = "rgba(255,255,255," + (flashA * 0.55).toFixed(3) + ")";
      ctx.fillRect(0, 0, w, h);
    }
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, WORLD_H - GROUND_H);
    g.addColorStop(0, "#3aa8bd");
    g.addColorStop(0.55, "#4ec0ca");
    g.addColorStop(1, "#9fe0d8");
    ctx.fillStyle = g;
    ctx.fillRect(-40, -40, WORLD_W + 80, WORLD_H + 80);

    // güneş
    ctx.fillStyle = "rgba(255,246,190,0.85)";
    ctx.beginPath();
    ctx.arc(WORLD_W * 0.78, 78, 34, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.beginPath();
    ctx.arc(WORLD_W * 0.78, 78, 52, 0, Math.PI * 2);
    ctx.fill();

    // bulutlar
    for (const c of clouds) {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(c.s, c.s);
      ctx.fillStyle = "rgba(255,255,255,0.82)";
      roundRect(-30, -8, 60, 16, 8); ctx.fill();
      ctx.beginPath(); ctx.arc(-12, -8, 13, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(8, -12, 16, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(24, -5, 10, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawHills() {
    const baseY = WORLD_H - GROUND_H;
    ctx.fillStyle = "#63c98a";
    for (const hl of hills) {
      ctx.beginPath();
      ctx.moveTo(hl.x, baseY);
      ctx.quadraticCurveTo(hl.x + hl.w / 2, baseY - hl.h, hl.x + hl.w, baseY);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,255,0.10)";
    ctx.fillRect(0, baseY - 6, WORLD_W, 6);
  }

  function drawPipes() {
    const bottomY = WORLD_H - GROUND_H;
    for (const p of pipes) {
      if (p.x > WORLD_W + 10 || p.x + PIPE_W < -10) continue;
      pipeBody(p.x, 0, PIPE_W, p.top, true);
      const y2 = p.top + PIPE_GAP;
      pipeBody(p.x, y2, PIPE_W, bottomY - y2, false);
    }
  }

  function pipeBody(x, y, w, h, isTop) {
    if (h <= 0) return;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, "#4a9b1f");
    g.addColorStop(0.22, "#8ed44f");
    g.addColorStop(0.55, "#63bf2b");
    g.addColorStop(1, "#38771a");
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);

    ctx.strokeStyle = "#2c5c14";
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);

    // ağız kısmı
    const capH = 26, capW = w + 12;
    const capY = isTop ? y + h - capH : y;
    const cg = ctx.createLinearGradient(x - 6, 0, x - 6 + capW, 0);
    cg.addColorStop(0, "#4a9b1f");
    cg.addColorStop(0.2, "#9ade5c");
    cg.addColorStop(0.6, "#63bf2b");
    cg.addColorStop(1, "#356f18");
    ctx.fillStyle = cg;
    ctx.fillRect(x - 6, capY, capW, capH);
    ctx.strokeStyle = "#2c5c14";
    ctx.strokeRect(x - 5, capY + 1, capW - 2, capH - 2);
  }

  function drawGround() {
    const y = WORLD_H - GROUND_H;
    ctx.fillStyle = "#ded895";
    ctx.fillRect(0, y, WORLD_W, GROUND_H);

    ctx.fillStyle = "#73bf2e";
    ctx.fillRect(0, y, WORLD_W, 12);
    ctx.fillStyle = "#5a9c23";
    ctx.fillRect(0, y + 12, WORLD_W, 5);

    ctx.fillStyle = "#d0c97f";
    for (let x = groundX - 32; x < WORLD_W + 32; x += 32) {
      ctx.beginPath();
      ctx.moveTo(x, y + 20);
      ctx.lineTo(x + 14, y + 20);
      ctx.lineTo(x + 6, y + GROUND_H);
      ctx.lineTo(x - 8, y + GROUND_H);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawPuffs() {
    for (const p of puffs) {
      const a = 1 - p.t / p.life;
      ctx.fillStyle = "rgba(255,255,255," + (a * 0.5).toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (1 + (1 - a)), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBird() {
    const x = BIRD_X();
    ctx.save();
    ctx.translate(x, bird.y);

    // Kanat gövdeden bağımsız: kafa dönse de yanda kalır.
    const t = performance.now() / 1000;
    const flapPhase = state === PLAY || state === READY
      ? Math.sin(t * (state === PLAY ? 14 : 5)) * 0.5
      : 0.8;
    drawWing(flapPhase + bird.rot * 0.35);

    ctx.rotate(bird.rot);

    // gölge / kontur
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath();
    ctx.arc(2, 4, BIRD_R + 1.5, 0, Math.PI * 2);
    ctx.fill();

    if (faceReady) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(faceImg, -BIRD_R, -BIRD_R, BIRD_R * 2, BIRD_R * 2);
      ctx.restore();
    } else {
      ctx.fillStyle = "#f8d347";
      ctx.beginPath();
      ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
      ctx.fill();
    }

    // çerçeve
    ctx.strokeStyle = "#2b2118";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
    ctx.stroke();

    // gaga
    ctx.fillStyle = "#f6a12a";
    ctx.strokeStyle = "#2b2118";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(BIRD_R - 3, 2);
    ctx.lineTo(BIRD_R + 11, 6);
    ctx.lineTo(BIRD_R - 3, 11);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  function drawWing(phase) {
    // Kafanın arkasında tek kanat: yukarı-aşağı çırpar.
    ctx.save();
    ctx.translate(-BIRD_R * 0.5, BIRD_R * 0.25);
    ctx.rotate(clamp(phase, -0.9, 0.9) * 0.8 - 0.1);
    ctx.fillStyle = "#f2c73f";
    ctx.strokeStyle = "#2b2118";
    ctx.lineWidth = 2.2;
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-BIRD_R * 0.7, -BIRD_R * 0.62, -BIRD_R * 1.5, -BIRD_R * 0.18);
    ctx.quadraticCurveTo(-BIRD_R * 0.85, BIRD_R * 0.52, 0, BIRD_R * 0.2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // ---------------------------------------------------------------- UI
  function pixelText(text, x, y, size, fill, stroke, align) {
    ctx.font = "900 " + size + "px ui-monospace, Menlo, Consolas, monospace";
    ctx.textAlign = align || "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    if (stroke) {
      ctx.lineWidth = Math.max(3, size * 0.16);
      ctx.strokeStyle = stroke;
      ctx.strokeText(text, x, y);
    }
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  }

  function drawUI() {
    if (state === PLAY || state === DYING) {
      const s = 1 + scorePop * 0.35;
      ctx.save();
      ctx.translate(WORLD_W / 2, 96);
      ctx.scale(s, s);
      pixelText(String(score), 0, 0, 54, "#ffffff", "#2b2118");
      ctx.restore();
    }

    if (state === READY) {
      pixelText("FLAPPY FACE", WORLD_W / 2, 108, 34, "#ffffff", "#2b2118");
      pixelText("EN İYİ: " + best, WORLD_W / 2, 146, 18, "#ffe9a8", "#2b2118");

      const bob = Math.sin(readyT * 3) * 6;
      ctx.save();
      ctx.globalAlpha = 0.92;
      ctx.translate(WORLD_W / 2, WORLD_H - GROUND_H - 128 + bob);
      // dokunma ikonu
      ctx.strokeStyle = "#2b2118";
      ctx.fillStyle = "#ffffff";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 20, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 10); ctx.lineTo(0, -8);
      ctx.moveTo(-8, 0); ctx.lineTo(0, -10); ctx.lineTo(8, 0);
      ctx.stroke();
      ctx.restore();

      pixelText("ZIPLAMAK İÇİN DOKUN", WORLD_W / 2, WORLD_H - GROUND_H - 86, 17, "#ffffff", "#2b2118");
    }

    if (paused) {
      ctx.fillStyle = "rgba(12,18,22,0.55)";
      ctx.fillRect(0, 0, WORLD_W, WORLD_H);
      pixelText("DURAKLATILDI", WORLD_W / 2, WORLD_H / 2 - 18, 28, "#ffffff", "#2b2118");
      pixelText("DEVAM İÇİN DOKUN", WORLD_W / 2, WORLD_H / 2 + 22, 17, "#ffdc63", "#2b2118");
    }

    if (state === OVER) {
      const t = Math.min(1, overT / 0.35);
      const ease = 1 - Math.pow(1 - t, 3);
      const isRecord = score > 0 && score >= best;
      const panelW = Math.min(WORLD_W - 44, 286);
      const panelH = isRecord ? 178 : 150;
      const px = (WORLD_W - panelW) / 2;
      const py = WORLD_H * 0.30 - (1 - ease) * 60;

      ctx.save();
      ctx.globalAlpha = ease;

      pixelText("OYUN BİTTİ", WORLD_W / 2, py - 36, 32, "#ffdc63", "#2b2118");

      ctx.fillStyle = "#211d17";
      roundRect(px, py, panelW, panelH, 14); ctx.fill();
      ctx.strokeStyle = "#ffdc63";
      ctx.lineWidth = 3;
      roundRect(px, py, panelW, panelH, 14); ctx.stroke();

      const colL = px + panelW * 0.28;
      const colR = px + panelW * 0.72;
      pixelText("SKOR", colL, py + 34, 15, "#b7ae97");
      pixelText(String(score), colL, py + 74, 40, "#ffffff", "#000000");
      pixelText("EN İYİ", colR, py + 34, 15, "#b7ae97");
      pixelText(String(best), colR, py + 74, 40, "#ffdc63", "#000000");

      ctx.strokeStyle = "rgba(255,220,99,0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px + panelW / 2, py + 22);
      ctx.lineTo(px + panelW / 2, py + 96);
      ctx.stroke();

      pixelText("MADALYA: " + medal(score), WORLD_W / 2, py + 122, 15, "#ffffff");

      if (isRecord) {
        pixelText("YENİ REKOR!", WORLD_W / 2, py + 154, 17, "#7ef08a", "#123018");
      }

      if (overT > 0.55) {
        const a = 0.78 + Math.sin(overT * 4) * 0.22;
        const ty = py + panelH + 44;
        ctx.globalAlpha = ease * a;
        ctx.fillStyle = "rgba(33,29,23,0.9)";
        roundRect(px + 8, ty - 17, panelW - 16, 34, 17); ctx.fill();
        pixelText("TEKRAR OYNAMAK İÇİN DOKUN", WORLD_W / 2, ty, 14, "#ffffff");
      }
      ctx.restore();
    }
  }

  function medal(s) {
    if (s >= 40) return "ELMAS";
    if (s >= 25) return "ALTIN";
    if (s >= 12) return "GÜMÜŞ";
    if (s >= 5) return "BRONZ";
    return "YOK";
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------------------------------------------------------------- loop
  let last = 0;
  function frame(ts) {
    if (!last) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05;   // sekme arka plandayken sıçramayı engelle
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // Test/otomasyon için küçük bir okuma penceresi.
  window.__flappy = {
    get state() { return state; },
    get score() { return score; },
    get best() { return best; },
    get bird() { return { x: BIRD_X(), y: bird.y, v: bird.v, r: BIRD_R }; },
    get pipes() { return pipes.map(p => ({ x: p.x, top: p.top, passed: p.passed })); },
    get world() { return { w: WORLD_W, h: WORLD_H, ground: GROUND_H, gap: PIPE_GAP, pw: PIPE_W }; },
    flap
  };

  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
