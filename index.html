<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4ec0ca">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Flappy Face</title>
<link rel="icon" href="assets/char1.png">
<link rel="apple-touch-icon" href="assets/char1.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #1b2a33;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* ---------------------------------------------------------- açılış ekranı */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6vh;
    background:
      radial-gradient(circle at 50% 38%, #6b2b57 0%, #2a1430 55%, #150a1c 100%);
    touch-action: none;
    transition: opacity .45s ease;
  }
  #splash.gone { opacity: 0; pointer-events: none; }

  #candy {
    width: min(58vw, 46vh, 300px);
    height: auto;
    animation: spin 2.6s linear infinite;
    filter: drop-shadow(0 0 26px rgba(255, 92, 168, .55));
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    #candy { animation-duration: 9s; }
  }

  #splash .title {
    font-size: clamp(26px, 8.5vw, 46px);
    font-weight: 900;
    letter-spacing: .04em;
    color: #ffdc63;
    text-shadow: 0 3px 0 #2b2118, 0 0 22px rgba(255, 220, 99, .35);
  }
  #splash .hint {
    font-size: clamp(13px, 3.8vw, 18px);
    font-weight: 700;
    letter-spacing: .12em;
    color: #ffffff;
    opacity: .9;
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: .35; } }
</style>
</head>

  // Supabase projesinin genel (anon) bilgileri. Boş bırakılırsa oyun sadece
  // cihazdaki rekorlarla çalışır, hiçbir şey bozulmaz.
  const SUPA_URL = "https://lsgqwwylijfdzbmkwrgc.supabase.co";
  const SUPA_KEY = "sb_publishable_SB2H5bAE4eHvV8eikJKG0Q__";

  const cloudOn = () => !!(SUPA_URL && SUPA_KEY);
  let gBests = CHARS.map(() => null);    // herkesin gördüğü rekorlar (null = bilinmiyor)

  // Eski anon anahtarları JWT'dir ve Bearer ister; yeni sb_publishable_ anahtarlarında
  // apikey başlığı tek başına yeterlidir (Bearer'a JWT olmayan değer koymak 401 döndürür).
  const cloudHeaders = () => {
    const h = { apikey: SUPA_KEY };
    if (SUPA_KEY.startsWith("eyJ")) h.Authorization = "Bearer " + SUPA_KEY;
    return h;
  };

  function cloudLoad() {
    if (!cloudOn()) return;
    fetch(SUPA_URL + "/rest/v1/char_scores?select=char_id,best", { headers: cloudHeaders() })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(rows => {
        rows.forEach(row => {
          const i = row.char_id;
          if (i >= 0 && i < CHARS.length) gBests[i] = row.best | 0;
        });
      })
      .catch(() => {});   // internet yoksa yerel rekorlarla devam
  }

  function cloudSubmit(i, sc) {
    if (!cloudOn() || sc <= 0) return;
    fetch(SUPA_URL + "/rest/v1/rpc/submit_score", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, cloudHeaders()),
      body: JSON.stringify({ p_char: i, p_name: CHARS[i].name, p_score: sc })
    })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(v => { if (typeof v === "number") gBests[i] = v; else cloudLoad(); })
      .catch(() => {});
  }

  // Gösterilecek rekor: ortak tablo varsa o, yoksa cihazdaki.
  const recordOf = (i) => (gBests[i] === null ? bestOf(i) : Math.max(gBests[i], bestOf(i)));

    for (const o of list) { if (r < o.w) return o; r -= o.w; }
    return list[0];

  // ---------------------------------------------------------------- audio
  let actx = null;
  function audio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") {
        const r = actx.resume();          // dokunuş öncesi reddedilebilir, sorun değil
        if (r && r.catch) r.catch(() => {});
      }
      return actx;
    } catch (e) { return null; }
  }

  // Karakterine ses eklenmişse çırpma sesi onun kaydı olur.
  // kind: "sfx" = çırpma sesi, "dsfx" = ölüm sesi
  const sfxBuf = {};        // "kind:index" -> AudioBuffer | null (yükleniyor) | undefined (denenmedi)
  let sfxNode = null;       // karakter sesleri (yenisi geleni keser)
  let introNode = null;     // giriş/bonus sesi (kesilmez)

  function loadBuf(key, src) {
    const a = audio();
    if (!a || !src || sfxBuf[key] !== undefined) return;
    sfxBuf[key] = null;
    fetch(src)
      .then(r => r.arrayBuffer())
      .then(buf => a.decodeAudioData(buf))
      .then(dec => { sfxBuf[key] = dec; })
      .catch(() => { sfxBuf[key] = undefined; });
  }

  function loadSfx(i, kind) { loadBuf(kind + ":" + i, CHARS[i] && CHARS[i][kind]); }
  function loadAllSfx(i) { loadSfx(i, "sfx"); loadSfx(i, "dsfx"); }

  // keep=true olanlar (giriş/bonus sesi) başka seslerle kesilmez, sonuna kadar çalar.
  function playBuf(key, src, keep) {
    const a = audio();
    if (!a || !src) return false;
    if (sfxBuf[key] === undefined) { loadBuf(key, src); return false; }
    if (!sfxBuf[key]) return false;
    const prev = keep ? introNode : sfxNode;
    if (prev) { try { prev.stop(); } catch (e) {} }   // yalnız kendi türünü kesip baştan başlar
    const n = a.createBufferSource();
    n.buffer = sfxBuf[key];
    const g = a.createGain();
    g.gain.value = 0.9;
    n.connect(g); g.connect(a.destination);
    n.start();
    if (keep) introNode = n; else sfxNode = n;
    return true;
  }

  function playSfx(i, kind) {
    return CHARS[i] ? playBuf(kind + ":" + i, CHARS[i][kind]) : false;
  }

  const playIntro = () => playBuf("intro", INTRO_SFX, true);

  function beep(freq, dur, type, vol, slideTo) {
    try {
      if (!audio()) return;
      const t = actx.currentTime;
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* sessiz devam */ }
  }

  // ---------------------------------------------------------------- layout
  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";

    // Dünya yüksekliği sabit, genişlik ekran oranından; uçlarda sınırla.
    // Normal telefon oranlarında bu "contain" tam ekranı doldurur (kenar boşluğu yok);
    // sadece çok dar ya da yatay ekranlarda kenarlarda bant kalır.
    WORLD_W = Math.min(Math.max(WORLD_H * (w / h), 288), 560);
    scale = Math.min(w / WORLD_W, h / WORLD_H);   // contain
    offX = (w - WORLD_W * scale) / 2;
    offY = (h - WORLD_H * scale) / 2;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);

  function makeScenery() {
    clouds.length = 0;

      pipes.push(makePipe(x));
      x += PIPE_SPACING;
    }
  }

  function makePipe(x) {
    const margin = 68;
    const lo = margin;
    const hi = WORLD_H - GROUND_H - PIPE_GAP - margin;
    // Ardışık boşluklar arasındaki dikey fark sınırlı olsun, yoksa yetişilmiyor.
    const a = lastTop === null ? lo : Math.max(lo, lastTop - 145);
    const b = lastTop === null ? hi : Math.min(hi, lastTop + 145);
    const top = rand(a, b);
    lastTop = top;
    return { x, top, passed: false, pick: makePick(top) };
  }

  // Çarpanlar boşluğun ortasına değil, bir kenarına yakın durur: karşı taraftan
  // dokunmadan geçilebilsin (özellikle bombadan kaçmak mümkün olsun).
  // İlk iki boru boş kalır ki oyuncu daha puan almadan çarpanla karşılaşmasın.
  let pipeNo = 0;
  function makePick(top) {
    if (pipeNo++ < 2) return null;
    const near = PICK_R + 19;                       // boru ağzına olan uzaklık
    const place = (def) => ({
      def, taken: false, t: 0,
      y: Math.random() < 0.5 ? top + near : top + PIPE_GAP - near
    });

    const ch = CHARS[sel];
    if (!ch.candy && !ch.storm) return null;               // bonusu olmayan karakter
    if (Math.random() < STAR_CHANCE) return place(STAR);   // bonus bileti
    if (Math.random() > 0.18) return null;

    let r = Math.random() * PICK_W;
    let def = PICKS[0];
    for (const p of PICKS) { if (r < p.w) { def = p; break; } r -= p.w; }
    // Bomba yalnız skor 2'ye tam bölünürken gelir; tek sayıda hiç çıkmaz.
    if (def.t === "bomb" && score % 2 !== 0) return null;
    return place(def);
  }

  function goSelect() {
    cloudLoad();          // menüye girerken ortak rekorları tazele
    state = SELECT;
    selT = 0;
    picked = -1;
    pickT = 0;
    score = 0;
    bird.y = WORLD_H * 0.42;
    bird.v = 0;
    bird.rot = 0;
    resetPipes();
    makeScenery();
  }

  function pick(i) {
    sel = i;
    picked = i;
    pickT = 0;
    try { localStorage.setItem("flappyface.char", String(i)); } catch (e) {}
    loadAllSfx(i);   // dokunuş anında yükle ki ilk çırpışta/ölümde hazır olsun
    if (CHARS[i].candy) {
      showCandy(CHARS[i].name);   // şeker ekranı + giriş sesi
    } else if (!playSfx(i, "dsfx") && !playSfx(i, "sfx")) {
      beep(720, 0.1, "square", 0.06, 1040);
    }
  }

  function stopSfx() {
    if (sfxNode) { try { sfxNode.stop(); } catch (e) {} sfxNode = null; }
    if (introNode) { try { introNode.stop(); } catch (e) {} introNode = null; }
  }

  function reset() {
    // Ölüm sesi yeni oyuna sarkmasın; ama seçim ekranından geliyorsak
    // az önce başlayan tanıtım sesini kesme.
    if (state !== SELECT) stopSfx();
    state = READY;
    bird.y = WORLD_H * 0.42;
    bird.v = 0;
    bird.rot = 0;
    score = 0;
    passed = 0;
    grabbed = 0;
    mult = 1;
    stack = [];
    multT = 0;
    bonusT = 0;
    bonusEndT = 0;
    items.length = 0;
    pops.length = 0;
    speed = BASE_SPEED;
    flashA = 0;
    overT = 0;
    readyT = 0;
    shake = 0;
    puffs.length = 0;
    resetPipes();
    makeScenery();
  }

  // ---------------------------------------------------------------- input
  function flap() {
    if (paused) { paused = false; last = 0; return; }
    if (state === SELECT) {
      if (picked < 0) pick(sel);   // klavyeyle: seçili olanı onayla
      return;
    }
    if (state === READY) {
      state = PLAY;
      bird.v = FLAP_V;
      sFlap();
      addPuff();
    } else if (state === PLAY || state === BONUS) {
      bird.v = FLAP_V;
      sFlap();
      addPuff();
      // Bonusta her basış 1 puan, ama tur başına en fazla TAP_CAP kadar:
      // hızlı hızlı basarak puan kasmak mümkün olmasın.
      if (state === BONUS && tapPts < TAP_CAP) {
        tapPts++;
        score += 1;
        bonusScore += 1;
        scorePop = 1;
      }

    } else if (state === OVER && overT > 0.55) {
      reset();
    }
  }

  function addPuff() {
    for (let i = 0; i < 4; i++) {
      puffs.push({
        x: BIRD_X() - BIRD_R * 0.5,
        y: bird.y + rand(0, BIRD_R),
        r: rand(3, 7),
        vx: rand(-70, -20),
        vy: rand(10, 60),
        life: rand(0.3, 0.6),
        t: 0
      });
    }
  }

  // Ekrandaki dokunulabilir alanlar; her karede çizimle birlikte yenilenir.
  let zones = [];
  function zone(x, y, w, h, fn) { zones.push({ x, y, w, h, fn }); }

  function onDown(e) {
    e.preventDefault();
    const wx = (e.clientX - offX) / scale;
    const wy = (e.clientY - offY) / scale;
    for (const z of zones) {
      if (wx >= z.x && wx <= z.x + z.w && wy >= z.y && wy <= z.y + z.h) { z.fn(); return; }
    }
    if (state !== SELECT) flap();
  }
  canvas.addEventListener("pointerdown", onDown, { passive: false });
  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); }, { passive: false });
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "Enter") {
      e.preventDefault();
      flap();
    }
  });
  document.addEventListener("gesturestart", (e) => e.preventDefault());
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && (state === PLAY || state === BONUS)) paused = true;
    last = 0;
  });
  window.addEventListener("blur", () => { if (state === PLAY || state === BONUS) paused = true; });

  // ---------------------------------------------------------------- update
  function update(dt) {
    if (paused) return;
    readyT += dt;
    if (scorePop > 0) scorePop = Math.max(0, scorePop - dt * 3);
    if (shake > 0) shake = Math.max(0, shake - dt * 3.5);
    if (flashA > 0) flashA = Math.max(0, flashA - dt * 2.4);

    // dekor
    for (const c of clouds) {
      c.x -= c.sp * dt * (state === PLAY ? 1 : 0.5);
      if (c.x < -90) { c.x = WORLD_W + rand(20, 160); c.y = rand(40, 260); c.s = rand(0.6, 1.5); }
    }

    if (state === SELECT) {
      selT += dt;
      if (picked >= 0) {
        pickT += dt;
        if (pickT > 0.3) reset();
      }
      groundX = (groundX - BASE_SPEED * 0.4 * dt) % 32;
      for (const h of hills) {
        h.x -= BASE_SPEED * 0.08 * dt;
        if (h.x + h.w < -20) h.x += 8 * 110;
      }
      return;
    }

    if (state === READY) {
      bird.y = WORLD_H * 0.42 + Math.sin(readyT * 3.4) * 9;
      bird.rot = Math.sin(readyT * 3.4) * 0.12;
      groundX = (groundX - BASE_SPEED * 0.5 * dt) % 32;
      for (const h of hills) {
        h.x -= BASE_SPEED * 0.1 * dt;
        if (h.x + h.w < -20) h.x += 8 * 110;
      }
      return;
    }

    if (state === BONUS) {
      bonusT -= dt;
      if (bonusEndT > 0) bonusEndT = Math.max(0, bonusEndT - dt);

      // uçuş: normal fizik, ama ölüm yok — zemine değince seker
      bird.v = Math.min(bird.v + GRAVITY * dt, MAX_FALL);
      bird.y += bird.v * dt;
      const target = clamp(bird.v / 520, -0.55, 1.35);
      bird.rot += (target - bird.rot) * Math.min(1, dt * 9);
      if (bird.y - BIRD_R < 0) { bird.y = BIRD_R; bird.v = 60; }
      if (bird.y + BIRD_R > WORLD_H - GROUND_H) {
        bird.y = WORLD_H - GROUND_H - BIRD_R;
        bird.v = -330;
      }

      groundX = (groundX - BONUS_SPEED * dt) % 32;
      for (const hl of hills) {
        hl.x -= BONUS_SPEED * 0.18 * dt;
        if (hl.x + hl.w < -20) hl.x += 8 * 110;
      }

      if (bonusMode !== "storm" && multT > 0) {
        multT -= dt;
        if (multT <= 0) { multT = 0; mult = 1; }
      }

      bonusSpawn -= dt;
      if (bonusSpawn <= 0) {
        spawnItem();
        bonusSpawn = rand(0.42, 0.62);
      }

      if (thrower.flash > 0) thrower.flash = Math.max(0, thrower.flash - dt);

      const bx0 = BIRD_X();
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.t += dt;
        if (bonusMode === "storm") {
          it.y += it.vy * dt;
          it.x += it.vx * dt;
          if (it.y > WORLD_H - GROUND_H + 30) { items.splice(i, 1); continue; }
        } else {
          it.x -= BONUS_SPEED * dt;
          if (it.x < -40) { items.splice(i, 1); continue; }
        }
        const rr = BIRD_R * 0.85 + (it.def ? it.def.r : 15);
        const dx = it.x - bx0, dy = it.y - bird.y;
        if (dx * dx + dy * dy < rr * rr) {
          takeItem(it);
          items.splice(i, 1);
        }
      }

      ageEffects(dt);
      if (bonusT <= 0) endBonus();
      return;
    }

    if (state === PLAY) {
      speed = Math.min(MAX_SPEED, BASE_SPEED + passed * 2.2);
      if (bonusEndT > 0) bonusEndT = Math.max(0, bonusEndT - dt);
      if (multT > 0) {
        multT -= dt;
        if (multT <= 0) { multT = 0; mult = 1; }
      }

      bird.v = Math.min(bird.v + GRAVITY * dt, MAX_FALL);
      bird.y += bird.v * dt;

      const target = clamp(bird.v / 520, -0.55, 1.35);
      bird.rot += (target - bird.rot) * Math.min(1, dt * 9);

      groundX = (groundX - speed * dt) % 32;
      for (const h of hills) {
        h.x -= speed * 0.18 * dt;
        if (h.x + h.w < -20) h.x += 8 * 110;
      }

      for (const p of pipes) p.x -= speed * dt;

      if (pipes.length && pipes[0].x + PIPE_W < -40) {
        pipes.shift();
        pipes.push(makePipe(pipes[pipes.length - 1].x + PIPE_SPACING));
      }

      const bx = BIRD_X();
      for (const p of pipes) {
        if (!p.passed && p.x + PIPE_W < bx - BIRD_R * 0.2) {
          p.passed = true;
          passed++;
          score += mult;
          scorePop = 1;
          sScore();
        }
        if (p.pick && !p.pick.taken) {
          p.pick.t += dt;
          const dx = (p.x + PIPE_W / 2) - bx;
          const dy = p.pick.y - bird.y;
          const rr = BIRD_R * 0.8 + PICK_R;   // görselden dar: sıyırmak toplamaz
          if (dx * dx + dy * dy < rr * rr) grab(p);
        }
      }

      // tavan
      if (bird.y - BIRD_R < 0) { bird.y = BIRD_R; bird.v = 0; }

      // zemin
      if (bird.y + BIRD_R >= WORLD_H - GROUND_H) {
        bird.y = WORLD_H - GROUND_H - BIRD_R;
        die(true);
      } else if (hitsPipe(bx, bird.y)) {
        die(false);
      }
    } else if (state === DYING) {
      bird.v = Math.min(bird.v + GRAVITY * 1.15 * dt, MAX_FALL);
      bird.y += bird.v * dt;
      bird.rot = Math.min(bird.rot + dt * 5.5, 1.6);
      if (bird.y + BIRD_R >= WORLD_H - GROUND_H) {
        bird.y = WORLD_H - GROUND_H - BIRD_R;
        state = OVER;
        overT = 0;
        shake = 0.8;
        sDie();
        if (score > bestOf(sel)) { bests[sel] = score; saveBests(); }
        cloudSubmit(sel, score);
      }
    } else if (state === OVER) {
      overT += dt;
    }

    ageEffects(dt);
  }

  function grab(p) {
    const k = p.pick;
    k.taken = true;
    grabbed++;

    if (k.def.t === "star") { startBonus(); return; }

    const isBomb = k.def.t === "bomb";
    const before = score;

    // Boru üretildiğinden beri skor tekleşmiş olabilir: o zaman bomba patlamaz,
    // puan hep tam bölünür.
    if (isBomb && score % 2 !== 0) {
      pops.push({ x: clamp(BIRD_X(), WORLD_W * 0.35, WORLD_W * 0.65),
                  y: bird.y - BIRD_R - 6, t: 0,
                  text: "PATLAMADI", sub: "TEK SAYI", c: "#ffffff" });
      beep(220, 0.12, "triangle", 0.05, 160);
      return;
    }

    const isKat = k.def.t === "kat";
    if (isBomb) {
      score = score / 2;               // skor çift, bölme tam
      mult = 1;                        // birikmiş çarpanı da söndürür
      stack = [];
    } else if (isKat) {
      mult = Math.min(MULT_CAP, mult * k.def.m);   // üstüne katlanır
    } else if (CHARS[sel].storm) {
      // BUKLE: boru çarpanları çarpılarak birikir (×2 sonra ×3 = ×6)
      mult = Math.min(MULT_CAP, mult * k.def.m);
    } else {
      // BAĞIMLI: toplanarak birikir (×2 sonra ×3 = ×5)
      mult = mult === 1 ? k.def.m : Math.min(MULT_CAP, mult + k.def.m);
    }
    multT = 0;
    scorePop = 1;

    pops.push({
      // yazı ekran kenarına taşmasın
      x: clamp(BIRD_X(), WORLD_W * 0.35, WORLD_W * 0.65), y: bird.y - BIRD_R - 6, t: 0,
      text: isBomb ? "BOMBA! ÷2" : isKat ? "KATLANDI" : k.def.label,
      sub: isBomb ? before + " → " + score : "BORU BAŞINA " + mult + " PUAN",
      c: k.def.c
    });

    for (let i = 0; i < (isBomb ? 14 : 9); i++) {
      puffs.push({
        x: p.x + PIPE_W / 2, y: k.y,
        r: rand(2, 5), vx: rand(-90, 30), vy: rand(-70, 70),
        life: rand(0.25, 0.5), t: 0, c: k.def.c
      });
    }

    if (isBomb) {
      shake = 1;
      flashA = 0.55;
      beep(150, 0.28, "sawtooth", 0.09, 50);
    } else if (isKat) {
      shake = 0.5;
      beep(560, 0.08, "square", 0.06, 840);
      setTimeout(() => beep(840, 0.09, "square", 0.055, 1260), 70);
      setTimeout(() => beep(1260, 0.12, "square", 0.05, 1680), 145);
    } else {
      shake = 0.35;
      beep(660, 0.08, "square", 0.06, 990);
      setTimeout(() => beep(990, 0.10, "square", 0.05, 1480), 70);
    }
  }

  function takeItem(it) {
    if (!it.def) {                       // çarpan
      if (!it.mult && it.mo) it.mult = it.mo.m;
      const c = it.mo ? it.mo.c : "#7ef08a";
      stack.push(it.mult);                // her iki modda da üst üste birikir
      mult = stackSum();
      multT = 0;
      const birim = bonusMode === "storm" ? "YILDIRIM" : "ŞEKER";
      pops.push({ x: BIRD_X(), y: Math.max(bird.y - BIRD_R - 6, 185), t: 0,
                  text: "×" + it.mult,
                  sub: bonusMode === "storm"
                       ? "TOPLAM ×" + mult
                       : birim + " BAŞINA " + it.mult + " PUAN",
                  c });
      if (it.mult >= 10) { shake = 0.6; flashA = 0.35; }
      beep(700, 0.08, "square", 0.06, 1050);
      setTimeout(() => beep(1050, 0.10, "square", 0.05, 1500), 70);
      if (it.mult >= 25) setTimeout(() => beep(1480, 0.16, "square", 0.05, 2100), 150);
      return;
    }
    const add = it.def.v * mult;
    score += add;
    bonusScore += add;
    scorePop = 1;
    if (it.def === GOLDEN || it.def === BOLT_G) {
      pops.push({ x: BIRD_X(), y: Math.max(bird.y - BIRD_R - 6, 175), t: 0,
                  text: "+" + add, sub: "", c: "#ffd54a" });
      beep(990, 0.12, "square", 0.06, 1480);
    } else {
      beep(720 + Math.random() * 120, 0.06, "square", 0.045, 1080);
    }
    for (let i = 0; i < 6; i++) {
      puffs.push({ x: it.x, y: it.y, r: rand(2, 4.5), vx: rand(-70, 20), vy: rand(-60, 60),
                   life: rand(0.2, 0.4), t: 0, c: it.def.c });
    }
  }

  function startBonus() {
    state = BONUS;
    bonusMode = CHARS[sel].storm ? "storm" : "candy";
    stack = mult > 1 ? [mult] : [];      // birikmiş çarpan bonusa taşınır
    thrower.x = WORLD_W / 2;
    thrower.flash = 0;
    bonusT = BONUS_TIME;
    bonusScore = 0;
    tapPts = 0;
    bonusSpawn = 0.35;
    bonusPhase = rand(0, 6.28);
    mult = stackSum();
    multT = 0;
    items.length = 0;
    flashA = 1;
    shake = 0.7;
    pops.push({
      x: WORLD_W / 2, y: WORLD_H * 0.52, t: 0,
      text: "BONUS!",
      sub: BONUS_TIME + (bonusMode === "storm" ? " SANİYE YILDIRIM FIRTINASI" : " SANİYE ŞEKER YAĞMURU"),
      c: bonusMode === "storm" ? "#8fdcff" : "#ffd54a"
    });
    // şeker ekranındaki giriş sesinin aynısı; yüklenmediyse kısa fanfar
    if (!playIntro()) {
      beep(660, 0.10, "square", 0.06, 880);
      setTimeout(() => beep(880, 0.10, "square", 0.06, 1170), 110);
      setTimeout(() => beep(1170, 0.18, "square", 0.06, 1570), 230);
    }
  }

  function endBonus() {
    state = PLAY;
    bonusEndT = 1.6;
    mult = 1;              // bonus bitince birikim sıfırlanır
    stack = [];
    multT = 0;
    items.length = 0;
    flashA = 0.7;
    passed = 0;                 // zorluk sayacı sıfır: hız ilk hâline döner
    speed = BASE_SPEED;
    // Boruları kuşun önünde yeniden diz: bonustan çıkar çıkmaz boruya çarpmasın.
    resetPipes();
    pops.push({
      x: WORLD_W / 2, y: WORLD_H * 0.52, t: 0,
      text: "+" + bonusScore, sub: "BONUS BİTTİ", c: "#ffd54a"
    });
    beep(880, 0.12, "square", 0.06, 620);
    setTimeout(() => beep(560, 0.2, "triangle", 0.06, 320), 130);
  }

  function spawnItem() {
    if (bonusMode === "storm") return spawnBolt();
    // Dalga hâlinde diz: bazen tek şeker, bazen üçlü sıra.
    const r = Math.random();
    // Yumuşak dalga: ardışık şekerler zincir gibi izlenebilsin
    const mid = (WORLD_H - GROUND_H) * 0.52;
    const y = mid + Math.sin(bonusPhase) * ((WORLD_H - GROUND_H) * 0.26);
    bonusPhase += 0.36;

    if (r < 0.06) {
      const o = rollMult();
      items.push({ x: WORLD_W + 24, y, def: null, mo: o, mult: o.m, taken: false, t: 0 });
    } else if (r < 0.16) {
      items.push({ x: WORLD_W + 24, y, def: GOLDEN, taken: false, t: 0 });
    } else if (r < 0.45) {
      for (let i = 0; i < 3; i++) {
        items.push({ x: WORLD_W + 24 + i * 32, y: y + i * 12, def: CANDY, taken: false, t: 0 });
      }
    } else {
      items.push({ x: WORLD_W + 24, y, def: CANDY, taken: false, t: 0 });
    }
  }

  // Uçuşan yazılar ve puf parçacıkları — her durumda işlemeli, yoksa ekranda kalır.
  function ageEffects(dt) {
    for (let i = pops.length - 1; i >= 0; i--) {
      const q = pops[i];
      q.t += dt;
      q.y -= 34 * dt;
      if (q.t >= 1.1) pops.splice(i, 1);
    }
    for (let i = puffs.length - 1; i >= 0; i--) {
      const p = puffs[i];
      p.t += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.t >= p.life) puffs.splice(i, 1);
    }
  }

  // Fırtına: yukarıdaki bulut yıldırımı kuşun sütununa doğru savurur.
  // Kuş yatayda duramadığı için hepsi onun hizasından geçmeli; yoksa
  // toplanamaz. Bulut rastgele bir yerden atar, yıldırım çapraz iner.
  function spawnBolt() {
    const r = Math.random();
    const x0 = rand(WORLD_W * 0.10, WORLD_W * 0.92);
    thrower.x += (x0 - thrower.x) * 0.7;       // bulut atacağı yere kayar
    thrower.flash = 0.3;

    const make = (extra, dx, dyOff) => {
      const vy = rand(200, 260);
      const y0 = -22 - (dyOff || 0);
      const targetY = (WORLD_H - GROUND_H) * 0.55;
      const t = Math.max(0.3, (targetY - y0) / vy);
      const xt = BIRD_X() + rand(-26, 26) + (dx || 0);   // kuşun sütununa doğru
      items.push(Object.assign({
        x: x0 + (dx || 0) * 0.4, y: y0, vy, vx: (xt - x0) / t, taken: false, t: 0
      }, extra));
    };

    if (r < 0.06) { const o = rollMult(); make({ def: null, mo: o, mult: o.m }, 0, 0); }
    else if (r < 0.16) make({ def: BOLT_G }, 0, 0);
    else if (r < 0.45) { make({ def: BOLT }, -26, 0); make({ def: BOLT }, 0, 30); make({ def: BOLT }, 26, 60); }
    else make({ def: BOLT }, 0, 0);
  }

  function hitsPipe(bx, by) {
    for (const p of pipes) {
      if (p.x > bx + BIRD_R || p.x + PIPE_W < bx - BIRD_R) continue;
      if (circleRect(bx, by, BIRD_R * 0.86, p.x, 0, PIPE_W, p.top)) return true;
      const by2 = p.top + PIPE_GAP;
      if (circleRect(bx, by, BIRD_R * 0.86, p.x, by2, PIPE_W, WORLD_H - GROUND_H - by2)) return true;
    }
    return false;
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = clamp(cx, rx, rx + rw);
    const ny = clamp(cy, ry, ry + rh);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function die(onGround) {
    sHit();
    flashA = 1;
    shake = 1;
    if (onGround) {
      state = OVER;
      overT = 0;
      sDie();
      if (score > bestOf(sel)) { bests[sel] = score; saveBests(); }
      cloudSubmit(sel, score);
    } else {
      state = DYING;
      bird.v = -190;
    }
  }

  // ---------------------------------------------------------------- draw
  function draw() {
    const w = window.innerWidth, h = window.innerHeight;

    ctx.fillStyle = "#1b2a33";
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.translate(offX, offY);
    ctx.scale(scale, scale);
    ctx.beginPath();
    ctx.rect(0, 0, WORLD_W, WORLD_H);
    ctx.clip();
    if (shake > 0) {
      ctx.translate(rand(-1, 1) * shake * 5, rand(-1, 1) * shake * 5);
    }

    drawSky();
    drawHills();
    if (state === BONUS) {
      if (bonusMode === "storm") drawThrower();
      drawItems();
    } else {
      drawPipes();
      drawPicks();
    }
    drawGround();
    drawPuffs();
    if (state !== SELECT) drawBird();
    if (state === BONUS && bonusMode === "storm") drawStack();
    drawPops();
    drawUI();

    ctx.restore();

    if (flashA > 0) {
      ctx.fillStyle = "rgba(255,255,255," + (flashA * 0.55).toFixed(3) + ")";
      ctx.fillRect(0, 0, w, h);
    }
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, WORLD_H - GROUND_H);
    if (state === BONUS && bonusMode === "storm") {
      g.addColorStop(0, "#0b2a55");
      g.addColorStop(0.55, "#1c4f92");
      g.addColorStop(1, "#63a8e8");
    } else if (state === BONUS) {
      g.addColorStop(0, "#6a2170");
      g.addColorStop(0.55, "#b23a86");
      g.addColorStop(1, "#ff9ec4");
    } else {
      g.addColorStop(0, "#3aa8bd");
      g.addColorStop(0.55, "#4ec0ca");
      g.addColorStop(1, "#9fe0d8");
    }
    ctx.fillStyle = g;
    ctx.fillRect(-40, -40, WORLD_W + 80, WORLD_H + 80);

    // güneş
    ctx.fillStyle = "rgba(255,246,190,0.85)";
    ctx.beginPath();
    ctx.arc(WORLD_W * 0.78, 78, 34, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.beginPath();
    ctx.arc(WORLD_W * 0.78, 78, 52, 0, Math.PI * 2);
    ctx.fill();

    // bulutlar
    for (const c of clouds) {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(c.s, c.s);
      ctx.fillStyle = "rgba(255,255,255,0.82)";
      roundRect(-30, -8, 60, 16, 8); ctx.fill();
      ctx.beginPath(); ctx.arc(-12, -8, 13, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(8, -12, 16, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(24, -5, 10, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawHills() {
    const baseY = WORLD_H - GROUND_H;
    ctx.fillStyle = "#63c98a";
    for (const hl of hills) {
      ctx.beginPath();
      ctx.moveTo(hl.x, baseY);
      ctx.quadraticCurveTo(hl.x + hl.w / 2, baseY - hl.h, hl.x + hl.w, baseY);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,255,0.10)";
    ctx.fillRect(0, baseY - 6, WORLD_W, 6);
  }

  // Normal borular yeşil; bonusu açan yıldızı taşıyan boru altın sarısı.
  const PIPE_SKIN = {
    green: { body: ["#4a9b1f", "#8ed44f", "#63bf2b", "#38771a"],
             cap:  ["#4a9b1f", "#9ade5c", "#63bf2b", "#356f18"], line: "#2c5c14" },
    gold:  { body: ["#a8760c", "#ffe07a", "#f0b428", "#8a5c07"],
             cap:  ["#a8760c", "#fff0b0", "#f5c33c", "#7d5206"], line: "#5c3d05" }
  };

  function drawPipes() {
    const bottomY = WORLD_H - GROUND_H;
    for (const p of pipes) {
      if (p.x > WORLD_W + 10 || p.x + PIPE_W < -10) continue;
      const skin = (p.pick && p.pick.def.t === "star") ? PIPE_SKIN.gold : PIPE_SKIN.green;
      pipeBody(p.x, 0, PIPE_W, p.top, true, skin);
      const y2 = p.top + PIPE_GAP;
      pipeBody(p.x, y2, PIPE_W, bottomY - y2, false, skin);
    }
  }

  function pipeBody(x, y, w, h, isTop, skin) {
    if (h <= 0) return;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, skin.body[0]);
    g.addColorStop(0.22, skin.body[1]);
    g.addColorStop(0.55, skin.body[2]);
    g.addColorStop(1, skin.body[3]);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);

    ctx.strokeStyle = skin.line;
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);

    // ağız kısmı
    const capH = 26, capW = w + 12;
    const capY = isTop ? y + h - capH : y;
    const cg = ctx.createLinearGradient(x - 6, 0, x - 6 + capW, 0);
    cg.addColorStop(0, skin.cap[0]);
    cg.addColorStop(0.2, skin.cap[1]);
    cg.addColorStop(0.6, skin.cap[2]);
    cg.addColorStop(1, skin.cap[3]);
    ctx.fillStyle = cg;
    ctx.fillRect(x - 6, capY, capW, capH);
    ctx.strokeStyle = skin.line;
    ctx.strokeRect(x - 5, capY + 1, capW - 2, capH - 2);
  }

  function drawGround() {
    const y = WORLD_H - GROUND_H;
    ctx.fillStyle = "#ded895";
    ctx.fillRect(0, y, WORLD_W, GROUND_H);

    ctx.fillStyle = "#73bf2e";
    ctx.fillRect(0, y, WORLD_W, 12);
    ctx.fillStyle = "#5a9c23";
    ctx.fillRect(0, y + 12, WORLD_W, 5);

    ctx.fillStyle = "#d0c97f";
    for (let x = groundX - 32; x < WORLD_W + 32; x += 32) {
      ctx.beginPath();
      ctx.moveTo(x, y + 20);
      ctx.lineTo(x + 14, y + 20);
      ctx.lineTo(x + 6, y + GROUND_H);
      ctx.lineTo(x - 8, y + GROUND_H);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawPuffs() {
    for (const p of puffs) {
      const a = 1 - p.t / p.life;
      ctx.globalAlpha = a * (p.c ? 0.9 : 0.5);
      ctx.fillStyle = p.c || "#ffffff";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (1 + (1 - a)), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPicks() {
    for (const p of pipes) {
      const k = p.pick;
      if (!k || k.taken) continue;
      const x = p.x + PIPE_W / 2;
      if (x < -30 || x > WORLD_W + 30) continue;
      const bob = Math.sin(k.t * 3.4 + p.top) * 3;
      const pulse = 1 + Math.sin(k.t * 6) * 0.05;

      ctx.save();
      ctx.translate(x, k.y + bob);
      ctx.scale(pulse, pulse);

      if (k.def.t === "star") {
        const rot = k.t * 1.6;
        ctx.rotate(Math.sin(rot) * 0.25);
        ctx.fillStyle = "rgba(255,213,74,0.25)";
        ctx.beginPath(); ctx.arc(0, 0, PICK_R + 9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ffd54a";
        ctx.strokeStyle = "#7a5a10";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const a = -Math.PI / 2 + i * Math.PI / 5;
          const rr = i % 2 ? PICK_R * 0.45 : PICK_R + 3;
          ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * rr, Math.sin(a) * rr);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (k.def.t === "bomb") {
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.beginPath(); ctx.arc(2, 3, PICK_R + 1, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#2b2b33";
        ctx.beginPath(); ctx.arc(0, 2, PICK_R - 1, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#12121a"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, 2, PICK_R - 1, 0, Math.PI * 2); ctx.stroke();
        // parlama
        ctx.fillStyle = "rgba(255,255,255,0.35)";
        ctx.beginPath(); ctx.arc(-5, -3, 3.4, 0, Math.PI * 2); ctx.fill();
        // fitil
        ctx.strokeStyle = "#8a6b3f"; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(4, -PICK_R + 3);
        ctx.quadraticCurveTo(12, -PICK_R - 4, 8, -PICK_R - 11);
        ctx.stroke();
        const f = 2.5 + Math.sin(k.t * 22) * 1.2;
        ctx.fillStyle = "#ffcf3f";
        ctx.beginPath(); ctx.arc(8, -PICK_R - 12, f, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ff6b3f";
        ctx.beginPath(); ctx.arc(8, -PICK_R - 12, f * 0.55, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = "rgba(0,0,0,0.22)";
        ctx.beginPath(); ctx.arc(2, 3, PICK_R + 1, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#211d17";
        ctx.beginPath(); ctx.arc(0, 0, PICK_R, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = k.def.c; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, PICK_R, 0, Math.PI * 2); ctx.stroke();
        if (k.def.t === "kat") {                 // katlayan: dış halka + parlama
          ctx.globalAlpha = 0.55 + Math.sin(k.t * 6) * 0.25;
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 0, PICK_R + 5, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = 1;
        }
        pixelText(k.def.label, 0, 1, 16, k.def.c);
      }
      ctx.restore();
    }
  }

  function drawItems() {
    for (const it of items) {
      ctx.save();
      ctx.translate(it.x, it.y + Math.sin(it.t * 4) * 3);

      if (!it.def) {                                  // çarpan küresi
        const c = it.mo ? it.mo.c : "#7ef08a";
        const R = it.mo ? it.mo.r : 16;
        const m = it.mult || (it.mo ? it.mo.m : 2);
        const big = m >= 10;
        const s = 1 + Math.sin(it.t * (big ? 9 : 7)) * (big ? 0.1 : 0.06);
        ctx.scale(s, s);
        if (big) {                                    // nadir olanlar parlasın
          ctx.fillStyle = c;
          ctx.globalAlpha = 0.2 + Math.sin(it.t * 9) * 0.08;
          ctx.beginPath(); ctx.arc(0, 0, R + 11, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1;
        }
        ctx.fillStyle = "rgba(0,0,0,0.22)";
        ctx.beginPath(); ctx.arc(2, 3, R + 1, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#211d17";
        ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = c; ctx.lineWidth = big ? 4 : 3;
        ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
        pixelText("×" + m, 0, 1, m >= 25 ? 15 : 17, c);
      } else if (it.def.bolt) {                       // yıldırım
        const r = it.def.r;
        ctx.rotate(Math.sin(it.t * 8) * 0.12);
        if (it.def === BOLT_G) {                     // yalnız altın olanda hale
          ctx.fillStyle = it.def.c;
          ctx.globalAlpha = 0.2;
          ctx.beginPath(); ctx.arc(0, 0, r + 6, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1;
        }
        ctx.beginPath();
        ctx.moveTo(-r * 0.28, -r);
        ctx.lineTo(r * 0.5, -r * 0.18);
        ctx.lineTo(r * 0.08, -r * 0.1);
        ctx.lineTo(r * 0.42, r);
        ctx.lineTo(-r * 0.5, r * 0.14);
        ctx.lineTo(-r * 0.08, r * 0.06);
        ctx.closePath();
        ctx.fillStyle = it.def.c;
        ctx.fill();
        ctx.strokeStyle = "#123a5e";
        ctx.lineWidth = 2;
        ctx.lineJoin = "round";
        ctx.stroke();
      } else {
        const r = it.def.r;
        ctx.rotate(it.t * 2.2);
        ctx.fillStyle = "rgba(0,0,0,0.2)";
        ctx.beginPath(); ctx.arc(2, 3, r + 1, 0, Math.PI * 2); ctx.fill();
        // şeker: iki renkli sarmal
        ctx.fillStyle = it.def === GOLDEN ? "#ffe9a8" : "#ffd7ea";
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = it.def.c;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, r, -0.5, 1.1);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, r, Math.PI - 0.5, Math.PI + 1.1);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "#2b2118"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
        // çubuk
        ctx.strokeStyle = "#e7e2d4"; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.moveTo(r - 1, 0); ctx.lineTo(r + 8, 0); ctx.stroke();
      }
      ctx.restore();
    }
  }

  // Fırtınayı savuran bulut (ekranın üstünde)
  function drawThrower() {
    ctx.save();
    ctx.translate(thrower.x, 30);
    const f = thrower.flash;
    if (f > 0) {                       // atış anında çakma
      ctx.fillStyle = "rgba(180,225,255," + (f * 1.8).toFixed(2) + ")";
      ctx.beginPath(); ctx.arc(0, 8, 54, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#1b3557";
    ctx.beginPath(); ctx.arc(-19, 3, 16, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(2, -5, 21, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(22, 3, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#274b7d";
    ctx.beginPath(); ctx.arc(2, -8, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = f > 0 ? "#cfefff" : "#7fb6ea";
    ctx.beginPath(); ctx.arc(-10, 2, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(14, 0, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Toplanan çarpanlar kuşun tepesinde üst üste dizilir
  function drawStack() {
    if (!stack.length) return;
    const x = BIRD_X();
    const show = stack.slice(-6);
    const topY = bird.y - BIRD_R - 16 - show.length * 17;
    // Kuş HUD'ın içine girerse rozetler solar, skoru kapatmasın.
    ctx.save();
    if (topY < 170) ctx.globalAlpha = 0.4;
    show.forEach((m, i) => {
      const o = BONUS_MULTS.find(v => v.m === m);
      const y = bird.y - BIRD_R - 16 - i * 17;
      ctx.save();
      ctx.translate(x, y + Math.sin(performance.now() / 260 + i) * 1.6);
      ctx.fillStyle = "#0d1b2e";
      roundRect(-15, -8, 30, 16, 8); ctx.fill();
      ctx.strokeStyle = o ? o.c : "#8fdcff";
      ctx.lineWidth = 2;
      roundRect(-15, -8, 30, 16, 8); ctx.stroke();
      pixelText("×" + m, 0, 1, 12, o ? o.c : "#8fdcff");
      ctx.restore();
    });
    ctx.restore();
  }

  function drawPops() {
    for (const q of pops) {
      const a = q.t < 0.8 ? 1 : 1 - (q.t - 0.8) / 0.3;
      const s = q.t < 0.16 ? 1 + (0.16 - q.t) * 3 : 1;
      ctx.save();
      ctx.globalAlpha = Math.max(0, a);
      ctx.translate(q.x, q.y);
      ctx.scale(s, s);
      pixelText(q.text, 0, 0, 26, q.c, "#2b2118");
      if (q.sub) pixelText(q.sub, 0, 21, 12, "#ffffff", "#2b2118");
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawBird() {
    const x = BIRD_X();
    ctx.save();
    ctx.translate(x, bird.y);

    // Kanat gövdeden bağımsız: kafa dönse de yanda kalır.
    const t = performance.now() / 1000;
    const flapPhase = state === PLAY || state === READY
      ? Math.sin(t * (state === PLAY ? 14 : 5)) * 0.5
      : 0.8;
    drawWing(flapPhase + bird.rot * 0.35);

    ctx.rotate(bird.rot);

    // gölge / kontur
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath();
    ctx.arc(2, 4, BIRD_R + 1.5, 0, Math.PI * 2);
    ctx.fill();

    if (faces[sel].ready) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(faces[sel].img, -BIRD_R, -BIRD_R, BIRD_R * 2, BIRD_R * 2);
      ctx.restore();
    } else {
      ctx.fillStyle = "#f8d347";
      ctx.beginPath();
      ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
      ctx.fill();
    }

    // çerçeve
    ctx.strokeStyle = "#2b2118";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
    ctx.stroke();

    // gaga
    ctx.fillStyle = "#f6a12a";
    ctx.strokeStyle = "#2b2118";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(BIRD_R - 3, 2);
    ctx.lineTo(BIRD_R + 11, 6);
    ctx.lineTo(BIRD_R - 3, 11);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  function drawWing(phase) {
    // Kafanın arkasında tek kanat: yukarı-aşağı çırpar.
    ctx.save();
    ctx.translate(-BIRD_R * 0.5, BIRD_R * 0.25);
    ctx.rotate(clamp(phase, -0.9, 0.9) * 0.8 - 0.1);
    ctx.fillStyle = "#f2c73f";
    ctx.strokeStyle = "#2b2118";
    ctx.lineWidth = 2.2;
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-BIRD_R * 0.7, -BIRD_R * 0.62, -BIRD_R * 1.5, -BIRD_R * 0.18);
    ctx.quadraticCurveTo(-BIRD_R * 0.85, BIRD_R * 0.52, 0, BIRD_R * 0.2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // ---------------------------------------------------------------- UI
  function pixelText(text, x, y, size, fill, stroke, align) {
    ctx.font = "900 " + size + "px ui-monospace, Menlo, Consolas, monospace";
    ctx.textAlign = align || "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    if (stroke) {
      ctx.lineWidth = Math.max(3, size * 0.16);
      ctx.strokeStyle = stroke;
      ctx.strokeText(text, x, y);
    }
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  }

  function drawUI() {
    zones = [];

    if (state === SELECT) { drawSelect(); return; }

    if (state === BONUS) {
      const s = 1 + scorePop * 0.35;
      ctx.save();
      ctx.translate(WORLD_W / 2, 88);
      ctx.scale(s, s);
      pixelText(String(score), 0, 0, 50, "#ffffff", "#2b2118");
      ctx.restore();

      const storm = bonusMode === "storm";
      const left = Math.max(0, bonusT);
      const bw = Math.min(WORLD_W - 60, 220), bx = WORLD_W / 2 - bw / 2, by = 126;
      pixelText((storm ? "FIRTINA  " : "BONUS  ") + left.toFixed(1) + " sn",
                WORLD_W / 2, by - 14, 15, storm ? "#8fdcff" : "#ffd54a", "#2b2118");
      ctx.fillStyle = "rgba(33,29,23,0.75)";
      roundRect(bx, by, bw, 9, 4.5); ctx.fill();
      ctx.fillStyle = left < 5 ? "#ff8f6b" : (storm ? "#8fdcff" : "#ffd54a");
      roundRect(bx, by, bw * (left / BONUS_TIME), 9, 4.5); ctx.fill();

      if (storm) {
        if (stack.length) {
          pixelText("TOPLAM ×" + stackSum(), WORLD_W / 2, by + 30, 22, "#8fdcff", "#0d1b2e");
        }
        return;                          // ayrıntılı rozetler kuşun üstünde
      }

      if (multT > 0) {
        const o = BONUS_MULTS.find(x => x.m === mult);
        pixelText("×" + mult, WORLD_W / 2, by + 32, mult >= 10 ? 26 : 22,
                  o ? o.c : "#7ef08a", "#2b2118");
      }
      return;
    }

    if (state === PLAY || state === DYING) {
      const s = 1 + scorePop * 0.35;
      ctx.save();
      ctx.translate(WORLD_W / 2, 96);
      ctx.scale(s, s);
      pixelText(String(score), 0, 0, 54, "#ffffff", "#2b2118");
      ctx.restore();

      if (bonusEndT > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, bonusEndT);
        pixelText("BONUS BİTTİ", WORLD_W / 2, 158, 18, "#ffd54a", "#2b2118");
        ctx.restore();
      }

      if (mult > 1) {          // birikmiş çarpan: süresi yok, ölene kadar durur
        const c = mult >= 10 ? "#ff9ae0" : mult >= 5 ? "#ffdc63" : mult >= 3 ? "#63d7ff" : "#7ef08a";
        pixelText("×" + mult, WORLD_W / 2, 138, mult >= 10 ? 26 : 22, c, "#2b2118");
      }
    }

    if (state === READY) {
      pixelText("FLAPPY FACE", WORLD_W / 2, 104, 34, "#ffffff", "#2b2118");
      pixelText(faces[sel].name + " — " + recordLabel() + ": " + recordOf(sel), WORLD_W / 2, 142, 16, "#ffe9a8", "#2b2118");
      button(WORLD_W / 2 - 74, 164, 148, 30, "KARAKTER DEĞİŞTİR", 13, goSelect);

      const bob = Math.sin(readyT * 3) * 6;
      ctx.save();
      ctx.globalAlpha = 0.92;
      ctx.translate(WORLD_W / 2, WORLD_H - GROUND_H - 128 + bob);
      // dokunma ikonu
      ctx.strokeStyle = "#2b2118";
      ctx.fillStyle = "#ffffff";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 20, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 10); ctx.lineTo(0, -8);
      ctx.moveTo(-8, 0); ctx.lineTo(0, -10); ctx.lineTo(8, 0);
      ctx.stroke();
      ctx.restore();

      pixelText("ZIPLAMAK İÇİN DOKUN", WORLD_W / 2, WORLD_H - GROUND_H - 86, 17, "#ffffff", "#2b2118");
    }

    if (paused) {
      ctx.fillStyle = "rgba(12,18,22,0.55)";
      ctx.fillRect(0, 0, WORLD_W, WORLD_H);
      pixelText("DURAKLATILDI", WORLD_W / 2, WORLD_H / 2 - 18, 28, "#ffffff", "#2b2118");
      pixelText("DEVAM İÇİN DOKUN", WORLD_W / 2, WORLD_H / 2 + 22, 17, "#ffdc63", "#2b2118");
    }

    if (state === OVER) {
      const t = Math.min(1, overT / 0.35);
      const ease = 1 - Math.pow(1 - t, 3);
      const isRecord = score > 0 && score >= recordOf(sel);
      const panelW = Math.min(WORLD_W - 44, 286);
      const panelH = isRecord ? 196 : 168;
      const px = (WORLD_W - panelW) / 2;
      const py = WORLD_H * 0.30 - (1 - ease) * 60;

      ctx.save();
      ctx.globalAlpha = ease;

      pixelText("OYUN BİTTİ", WORLD_W / 2, py - 36, 32, "#ffdc63", "#2b2118");

      ctx.fillStyle = "#211d17";
      roundRect(px, py, panelW, panelH, 14); ctx.fill();
      ctx.strokeStyle = "#ffdc63";
      ctx.lineWidth = 3;
      roundRect(px, py, panelW, panelH, 14); ctx.stroke();

      const colL = px + panelW * 0.28;
      const colR = px + panelW * 0.72;
      pixelText("SKOR", colL, py + 34, 15, "#b7ae97");
      pixelText(String(score), colL, py + 74, 40, "#ffffff", "#000000");
      pixelText(recordLabel(), colR, py + 34, 15, "#b7ae97");
      pixelText(String(recordOf(sel)), colR, py + 74, 40, "#ffdc63", "#000000");

      ctx.strokeStyle = "rgba(255,220,99,0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px + panelW / 2, py + 22);
      ctx.lineTo(px + panelW / 2, py + 96);
      ctx.stroke();

      pixelText(faces[sel].name + " • MADALYA: " + medal(score), WORLD_W / 2, py + 120, 14, "#ffffff");
      pixelText("SENİN REKORUN: " + bestOf(sel), WORLD_W / 2, py + 142, 13, "#b7ae97");

      if (isRecord) {
        pixelText(cloudOn() ? "HERKESİN REKORUNU KIRDIN!" : "YENİ REKOR!",
                  WORLD_W / 2, py + 172, cloudOn() ? 13 : 17, "#7ef08a", "#123018");
      }

      if (overT > 0.55) {
        const a = 0.78 + Math.sin(overT * 4) * 0.22;
        const ty = py + panelH + 44;
        ctx.globalAlpha = ease * a;
        ctx.fillStyle = "rgba(33,29,23,0.9)";
        roundRect(px + 8, ty - 17, panelW - 16, 34, 17); ctx.fill();
        pixelText("TEKRAR OYNAMAK İÇİN DOKUN", WORLD_W / 2, ty, 14, "#ffffff");
        ctx.globalAlpha = ease;
        button(WORLD_W / 2 - 80, ty + 28, 160, 32, "KARAKTER DEĞİŞTİR", 13, goSelect);
      }
      ctx.restore();
    }
  }

  function button(x, y, w, h, label, size, fn) {
    ctx.fillStyle = "#211d17";
    roundRect(x, y, w, h, h / 2); ctx.fill();
    ctx.strokeStyle = "#ffdc63";
    ctx.lineWidth = 2;
    roundRect(x, y, w, h, h / 2); ctx.stroke();
    pixelText(label, x + w / 2, y + h / 2 + 1, size, "#ffdc63");
    zone(x - 6, y - 6, w + 12, h + 12, fn);
  }

  function drawSelect() {
    ctx.fillStyle = "rgba(12,18,22,0.55)";
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);

    // Başlık iki satıra sığsın; dar ekranda punto küçülür.
    const tw = WORLD_W - 24;
    const s1 = Math.min(26, tw / 6.4);
    pixelText("HANGİ LUBUNYAYI", WORLD_W / 2, 62, s1, "#ffdc63", "#2b2118");
    pixelText("SEÇİYORSUN", WORLD_W / 2, 62 + s1 * 1.25, s1, "#ffdc63", "#2b2118");

    // Izgara karakter sayısına göre: 6'ya kadar 2 sütun, sonrası 3 sütun.
    const cols = faces.length <= 6 ? 2 : 3;
    const rows = Math.ceil(faces.length / cols);
    const top = 62 + s1 * 1.25 + (rows > 3 ? 32 : 42);
    const bottom = WORLD_H - GROUND_H - 40;          // "BİRİNE DOKUN" satırına değmesin
    const cellW = WORLD_W / cols;
    const cellH = Math.min(116, (bottom - top) / rows);
    // Yarıçap hem satır yüksekliğine hem sütun genişliğine sığmalı; altta iki
    // satır yazı için yer kalsın diye 0.30 katsayısı kullanıldı.
    const r = Math.min(36, cellH * 0.30, cellW * 0.33);
    const nameSize = clamp(r * 0.42, 9, 14);
    const bestSize = clamp(r * 0.33, 8, 11);

    faces.forEach((f, i) => {
      const row = Math.floor(i / cols);
      const col = i % cols;
      const inRow = Math.min(cols, faces.length - row * cols);   // son satır tek ise ortala
      const cx = WORLD_W / 2 + (col - (inRow - 1) / 2) * cellW;
      const cy = top + cellH * row + cellH / 2 - 8;
      const isSel = i === sel;
      const bump = (picked === i ? Math.sin(Math.min(pickT / 0.3, 1) * Math.PI) * 0.18 : 0)
                 + (isSel ? Math.sin(selT * 3 + i) * 0.03 : 0);
      const rr = r * (1 + bump);

      ctx.save();
      ctx.translate(cx, cy);

      // seçili halka
      if (isSel) {
        ctx.strokeStyle = "#ffdc63";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, rr + 7, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.beginPath(); ctx.arc(2, 4, rr + 2, 0, Math.PI * 2); ctx.fill();

      if (f.ready) {
        ctx.save();
        ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(f.img, -rr, -rr, rr * 2, rr * 2);
        ctx.restore();
      } else {
        ctx.fillStyle = "#f8d347";
        ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2); ctx.fill();
      }

      ctx.strokeStyle = "#2b2118";
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2); ctx.stroke();

      // kendi sesi olan karakterin rozeti
      if (CHARS[i].sfx || CHARS[i].dsfx) {
        const bx = rr * 0.72, by = rr * 0.72;
        ctx.fillStyle = "#211d17";
        ctx.beginPath(); ctx.arc(bx, by, 11, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#ffdc63";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(bx, by, 11, 0, Math.PI * 2); ctx.stroke();
        pixelText("♪", bx, by + 1, 14, "#ffdc63");
      }

      ctx.restore();

      const nameY = cy + r + nameSize * 0.85;
      const bestY = nameY + nameSize * 0.6 + bestSize * 0.75;
      pixelText(f.name, cx, nameY, nameSize, isSel ? "#ffdc63" : "#ffffff", "#2b2118");
      pixelText(recordLabel() + " " + recordOf(i), cx, bestY, bestSize, "#cfe6e2", "#2b2118");

      const pad = Math.min(12, cellW * 0.5 - r);
      zone(cx - r - pad, cy - r - pad, (r + pad) * 2, (r + pad) + (bestY - cy) + bestSize, () => pick(i));
    });

    if (picked < 0) {
      const a = 0.7 + Math.sin(selT * 4) * 0.3;
      ctx.save();
      ctx.globalAlpha = a;
      pixelText("BİRİNE DOKUN", WORLD_W / 2, WORLD_H - GROUND_H - 22, 15, "#ffffff", "#2b2118");
      ctx.restore();
    }
  }

  function medal(s) {
    if (s >= 40) return "ELMAS";
    if (s >= 25) return "ALTIN";
    if (s >= 12) return "GÜMÜŞ";
    if (s >= 5) return "BRONZ";
    return "YOK";
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------------------------------------------------------------- loop
  let last = 0;
  function frame(ts) {
    if (!last) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05;   // sekme arka plandayken sıçramayı engelle
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // Test/otomasyon için küçük bir okuma penceresi.
  window.__flappy = {
    get state() { return state; },
    get score() { return score; },
    get best() { return bestOf(sel); },
    get sel() { return sel; },
    get chars() { return CHARS.map(c => c.name); },
    get sfxReady() { return !!sfxBuf["sfx:" + sel]; },
    get dsfxReady() { return !!sfxBuf["dsfx:" + sel]; },
    playSfx: (kind) => playSfx(sel, kind || "sfx"),
    pick,
    goSelect,
    get bird() { return { x: BIRD_X(), y: bird.y, v: bird.v, r: BIRD_R }; },
    get pipes() { return pipes.map(p => ({ x: p.x, top: p.top, passed: p.passed })); },
    get grabbed() { return grabbed; },
    get mult() { return mult; },
    get bonusT() { return bonusT; },
    get bonusScore() { return bonusScore; },
    get items() { return items.map(i => ({ x: i.x, y: i.y, mult: i.mult || 0, v: i.def ? i.def.v : 0 })); },
    startBonus,
    get picks() {
      return pipes.filter(p => p.pick && !p.pick.taken)
                  .map(p => ({ x: p.x + PIPE_W / 2, y: p.pick.y, t: p.pick.def.t }));
    },
    get world() { return { w: WORLD_W, h: WORLD_H, ground: GROUND_H, gap: PIPE_GAP, pw: PIPE_W }; },
    flap
  };

  resize();
  reset();
  goSelect();
  // Sesleri açılışta çöz: ilk seçimde de anında çalsınlar.
  // (AudioContext dokunuştan önce askıda kalır, decode etmeye engel değil.)
  CHARS.forEach((c, i) => loadAllSfx(i));
  loadBuf("intro", INTRO_SFX);

  // ------------------------------------------- şeker ekranı (yalnız BAĞIMLI'da)
  const splash = document.getElementById("splash");
  let splashT = null;

  function showCandy(name) {
    splash.querySelector(".title").textContent = name;
    splash.style.display = "flex";
    // tarayıcı geçişi yakalayabilsin diye bir kare bekle
    requestAnimationFrame(() => splash.classList.remove("gone"));
    playIntro();
    clearTimeout(splashT);
    splashT = setTimeout(hideCandy, 3800);
  }

  function hideCandy() {
    clearTimeout(splashT);
    if (splash.classList.contains("gone")) return;
    splash.classList.add("gone");
    setTimeout(() => { splash.style.display = "none"; }, 500);
  }

  splash.addEventListener("pointerdown", (e) => { e.preventDefault(); hideCandy(); }, { passive: false });
  splash.addEventListener("touchstart", (e) => e.preventDefault(), { passive: false });
  cloudLoad();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
